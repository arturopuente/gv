[package]
name = "gv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
minijinja = "2.24.0"
open = "5.4.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = "5.3.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
toml = "1.1.6"
two-face = "0.5.2"
unicode-width = "0.2.2"
